<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent Pro</title>

  <style>
    *{box-sizing:border-box}

    :root{
      --bg:#0b1020;
      --panel:#11182b;
      --panel2:#151e35;
      --border:rgba(255,255,255,.08);
      --text:#f5f7ff;
      --muted:#9ca8c7;
      --accent:#7c5cff;
      --accent2:#5b8cff;
      --danger:#ff5571;
      --success:#27d69b;
    }

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      overflow:hidden;
    }

    button,input,textarea{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .app{
      height:100vh;
      display:flex;
    }

    /* SIDEBAR */
    .sidebar{
      width:290px;
      background:#0d1426;
      border-left:1px solid var(--border);
      display:flex;
      flex-direction:column;
      transition:.25s;
      z-index:20;
    }

    .brand{
      padding:20px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:13px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      font-size:18px;
      box-shadow:0 8px 25px rgba(92,80,255,.3);
    }

    .brand-text strong{
      display:block;
      font-size:16px;
    }

    .brand-text span{
      color:var(--muted);
      font-size:12px;
    }

    .new-chat{
      margin:15px;
      padding:13px;
      border:1px solid rgba(124,92,255,.5);
      background:rgba(124,92,255,.12);
      color:white;
      border-radius:12px;
      font-weight:bold;
    }

    .new-chat:hover{
      background:rgba(124,92,255,.22);
    }

    .side-title{
      padding:0 16px 8px;
      color:var(--muted);
      font-size:12px;
    }

    .conversations{
      flex:1;
      overflow-y:auto;
      padding:0 10px 10px;
    }

    .conversation{
      padding:12px;
      margin-bottom:5px;
      border-radius:10px;
      display:flex;
      align-items:center;
      gap:8px;
      color:#dfe5f7;
      transition:.15s;
    }

    .conversation:hover{
      background:rgba(255,255,255,.05);
    }

    .conversation.active{
      background:rgba(124,92,255,.16);
    }

    .conversation-name{
      flex:1;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      font-size:14px;
    }

    .conversation-menu{
      opacity:0;
      background:none;
      border:0;
      color:#aab4d0;
      padding:4px;
    }

    .conversation:hover .conversation-menu{
      opacity:1;
    }

    .bottom-side{
      border-top:1px solid var(--border);
      padding:12px;
    }

    .user-card{
      padding:12px;
      background:rgba(255,255,255,.04);
      border-radius:12px;
      margin-bottom:8px;
    }

    .user-name{
      font-weight:bold;
      font-size:14px;
    }

    .user-email{
      color:var(--muted);
      font-size:11px;
      margin-top:4px;
      direction:ltr;
      text-align:right;
    }

    .logout{
      width:100%;
      border:0;
      background:transparent;
      color:#ff8ca0;
      padding:10px;
      border-radius:9px;
    }

    .logout:hover{
      background:rgba(255,85,113,.08);
    }

    /* MAIN */
    .main{
      flex:1;
      display:flex;
      flex-direction:column;
      min-width:0;
      position:relative;
    }

    .topbar{
      height:70px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      background:rgba(11,16,32,.9);
    }

    .menu-btn{
      display:none;
      background:none;
      border:0;
      color:white;
      font-size:22px;
    }

    .chat-title{
      font-weight:bold;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      max-width:55%;
    }

    .status{
      font-size:12px;
      color:var(--success);
    }

    /* CHAT */
    .chat{
      flex:1;
      overflow-y:auto;
      padding:30px 15px 130px;
    }

    .messages{
      max-width:900px;
      margin:auto;
    }

    .welcome{
      text-align:center;
      padding:60px 20px 30px;
    }

    .welcome-logo{
      width:70px;
      height:70px;
      margin:0 auto 20px;
      border-radius:22px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:bold;
    }

    .welcome h1{
      margin:0 0 10px;
      font-size:28px;
    }

    .welcome p{
      color:var(--muted);
      margin:0;
    }

    .message{
      display:flex;
      gap:12px;
      margin-bottom:22px;
    }

    .message.user{
      flex-direction:row-reverse;
    }

    .avatar{
      width:34px;
      height:34px;
      min-width:34px;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#202b49;
      font-size:13px;
      font-weight:bold;
    }

    .message.user .avatar{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
    }

    .bubble{
      max-width:min(75%,700px);
      padding:13px 15px;
      border-radius:15px;
      background:var(--panel);
      border:1px solid var(--border);
      line-height:1.75;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .message.user .bubble{
      background:#1b2540;
    }

    /* INPUT */
    .composer-wrap{
      position:absolute;
      bottom:0;
      right:0;
      left:0;
      padding:15px;
      background:linear-gradient(transparent,var(--bg) 25%);
    }

    .composer{
      max-width:900px;
      margin:auto;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:17px;
      display:flex;
      align-items:flex-end;
      padding:8px;
      box-shadow:0 -10px 35px rgba(0,0,0,.25);
    }

    textarea{
      flex:1;
      resize:none;
      border:0;
      outline:0;
      background:transparent;
      color:white;
      padding:11px;
      max-height:140px;
      min-height:45px;
    }

    textarea::placeholder{
      color:#74809d;
    }

    .send{
      width:44px;
      height:44px;
      border:0;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;
      font-size:18px;
    }

    .send:disabled{
      opacity:.45;
      cursor:not-allowed;
    }

    .typing{
      color:var(--muted);
      font-size:13px;
      margin:0 0 15px 47px;
      display:none;
    }

    /* MODAL */
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.65);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:100;
      padding:20px;
    }

    .modal{
      width:min(420px,100%);
      background:#121a2d;
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px;
    }

    .modal h3{
      margin-top:0;
    }

    .modal input{
      width:100%;
      padding:13px;
      border-radius:10px;
      border:1px solid var(--border);
      background:#0c1324;
      color:white;
      outline:none;
    }

    .modal-actions{
      display:flex;
      gap:8px;
      margin-top:15px;
    }

    .modal-actions button{
      flex:1;
      padding:11px;
      border-radius:10px;
      border:0;
    }

    .confirm{
      background:var(--accent);
      color:white;
    }

    .cancel{
      background:#222c45;
      color:white;
    }

    /* TOAST */
    .toast{
      position:fixed;
      bottom:25px;
      left:50%;
      transform:translateX(-50%) translateY(100px);
      background:#1c2740;
      border:1px solid var(--border);
      padding:12px 18px;
      border-radius:12px;
      opacity:0;
      transition:.25s;
      z-index:200;
      max-width:90%;
      text-align:center;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
      opacity:1;
    }

    /* MOBILE */
    @media(max-width:750px){

      .sidebar{
        position:fixed;
        top:0;
        bottom:0;
        right:0;
        transform:translateX(100%);
        box-shadow:-15px 0 40px rgba(0,0,0,.4);
      }

      .sidebar.open{
        transform:translateX(0);
      }

      .menu-btn{
        display:block;
      }

      .topbar{
        padding:0 12px;
      }

      .chat-title{
        max-width:50%;
        font-size:14px;
      }

      .status{
        display:none;
      }

      .bubble{
        max-width:85%;
      }

      .welcome{
        padding-top:45px;
      }

      .welcome h1{
        font-size:23px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">AI</div>
      <div class="brand-text">
        <strong>AI Agent Pro</strong>
        <span>مساعدك الذكي</span>
      </div>
    </div>

    <button class="new-chat" id="newChatBtn">
      ＋ محادثة جديدة
    </button>

    <div class="side-title">محادثاتك</div>

    <div class="conversations" id="conversationList"></div>

    <div class="bottom-side">

      <div class="user-card">
        <div class="user-name" id="userName">...</div>
        <div class="user-email" id="userEmail">...</div>
      </div>

      <button class="logout" id="logoutBtn">
        تسجيل الخروج
      </button>

    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button class="menu-btn" id="menuBtn">☰</button>

      <div class="chat-title" id="chatTitle">
        محادثة جديدة
      </div>

      <div class="status">
        ● متصل
      </div>

    </header>

    <section class="chat" id="chat">

      <div class="messages" id="messages">

        <div class="welcome" id="welcome">

          <div class="welcome-logo">AI</div>

          <h1>مرحباً بك في AI Agent Pro</h1>

          <p>
            ابدأ محادثة جديدة مع وكيل الذكاء الاصطناعي الخاص بك.
          </p>

        </div>

      </div>

      <div class="typing" id="typing">
        الذكاء الاصطناعي يكتب...
      </div>

    </section>

    <div class="composer-wrap">

      <form class="composer" id="composer">

        <textarea
          id="messageInput"
          placeholder="اكتب رسالتك هنا..."
          rows="1"
          maxlength="3000"
        ></textarea>

        <button class="send" id="sendBtn" type="submit">
          ➤
        </button>

      </form>

    </div>

  </main>

</div>

<!-- RENAME MODAL -->
<div class="overlay" id="renameOverlay">

  <div class="modal">

    <h3>إعادة تسمية المحادثة</h3>

    <input
      id="renameInput"
      maxlength="80"
      placeholder="اسم المحادثة"
    >

    <div class="modal-actions">
      <button class="cancel" id="renameCancel">إلغاء</button>
      <button class="confirm" id="renameConfirm">حفظ</button>
    </div>

  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>


<script>

  let conversations = [];
  let currentConversationId = null;
  let currentUser = null;
  let renameConversationId = null;
  let sending = false;

  const $ = id => document.getElementById(id);

  /* ---------------- API ---------------- */

  async function api(url, options = {}) {

    const response = await fetch(url, {
      credentials: "include",
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    let data = {};

    try {
      data = await response.json();
    } catch {}

    if (!response.ok) {

      if (response.status === 401) {
        window.location.href = "/";
      }

      throw new Error(data.error || "حدث خطأ");
    }

    return data;
  }


  /* ---------------- TOAST ---------------- */

  let toastTimer;

  function showToast(message) {

    const toast = $("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2800);
  }


  /* ---------------- USER ---------------- */

  async function loadUser() {

    try {

      const data = await api("/api/me");

      if (!data.user) {
        window.location.href = "/";
        return;
      }

      currentUser = data.user;

      $("userName").textContent =
        currentUser.name || "المستخدم";

      $("userEmail").textContent =
        currentUser.email || "";

    } catch (error) {

      showToast(error.message);

    }
  }


  /* ---------------- CONVERSATIONS ---------------- */

  async function loadConversations() {

    const data = await api("/api/conversations");

    conversations = Array.isArray(data.conversations)
      ? data.conversations
      : [];

    renderConversationList();

    if (!conversations.length) {

      await createConversation();

      return;
    }

    const exists = conversations.some(
      c => c.id === currentConversationId
    );

    if (!exists) {

      await openConversation(conversations[0].id);

    } else {

      await openConversation(currentConversationId);

    }
  }


  function renderConversationList() {

    const list = $("conversationList");

    list.innerHTML = "";

    conversations.forEach(conversation => {

      const item = document.createElement("div");

      item.className =
        "conversation" +
        (conversation.id === currentConversationId
          ? " active"
          : "");

      const name = document.createElement("div");

      name.className = "conversation-name";

      name.textContent =
        conversation.title || "محادثة جديدة";

      const menu = document.createElement("button");

      menu.className = "conversation-menu";
      menu.textContent = "⋮";
      menu.title = "خيارات";

      menu.addEventListener("click", event => {

        event.stopPropagation();

        openConversationMenu(conversation);

      });

      item.appendChild(name);
      item.appendChild(menu);

      item.addEventListener("click", () => {

        openConversation(conversation.id);

      });

      list.appendChild(item);

    });

  }


  async function createConversation() {

    try {

      const data = await api("/api/conversations", {
        method: "POST",
        body: JSON.stringify({
          title: "محادثة جديدة"
        })
      });

      const conversation = data.conversation;

      conversations.unshift(conversation);

      currentConversationId = conversation.id;

      renderConversationList();

      renderMessages([]);

      $("chatTitle").textContent =
        conversation.title || "محادثة جديدة";

      closeSidebar();

      return conversation;

    } catch (error) {

      showToast(error.message);

    }
  }


  async function openConversation(id) {

    try {

      const data = await api(
        `/api/conversations/${encodeURIComponent(id)}`
      );

      const conversation = data.conversation;

      currentConversationId = conversation.id;

      $("chatTitle").textContent =
        conversation.title || "محادثة جديدة";

      renderMessages(
        Array.isArray(conversation.messages)
          ? conversation.messages
          : []
      );

      renderConversationList();

      closeSidebar();

      scrollToBottom();

    } catch (error) {

      showToast(error.message);

    }
  }


  async function renameConversation(conversation) {

    renameConversationId = conversation.id;

    $("renameInput").value =
      conversation.title || "";

    $("renameOverlay").style.display = "flex";

    setTimeout(() => {

      $("renameInput").focus();
      $("renameInput").select();

    }, 50);
  }


  async function confirmRename() {

    const title =
      $("renameInput").value.trim();

    if (!title) {

      showToast("اكتبي اسم المحادثة");

      return;
    }

    try {

      const data = await api(
        `/api/conversations/${encodeURIComponent(renameConversationId)}`,
        {
          method: "PUT",
          body: JSON.stringify({ title })
        }
      );

      const updated = data.conversation;

      conversations =
        conversations.map(c =>
          c.id === updated.id ? updated : c
        );

      if (currentConversationId === updated.id) {

        $("chatTitle").textContent =
          updated.title;

      }

      renderConversationList();

      closeRename();

      showToast("تم تغيير اسم المحادثة");

    } catch (error) {

      showToast(error.message);

    }
  }


  async function deleteConversation(conversation) {

    const ok = confirm(
      `حذف المحادثة "${conversation.title || "محادثة جديدة"}"؟`
    );

    if (!ok) return;

    try {

      await api(
        `/api/conversations/${encodeURIComponent(conversation.id)}`,
        {
          method: "DELETE"
        }
      );

      conversations =
        conversations.filter(
          c => c.id !== conversation.id
        );

      if (currentConversationId === conversation.id) {

        currentConversationId = null;

        if (conversations.length) {

          await openConversation(
            conversations[0].id
          );

        } else {

          await createConversation();

        }

      } else {

        renderConversationList();

      }

      showToast("تم حذف المحادثة");

    } catch (error) {

      showToast(error.message);

    }
  }


  function openConversationMenu(conversation) {

    const action =
      prompt(
        "اكتبي:\n1 = إعادة تسمية\n2 = حذف"
      );

    if (action === "1") {

      renameConversation(conversation);

    } else if (action === "2") {

      deleteConversation(conversation);

    }

  }


  /* ---------------- MESSAGES ---------------- */

  function renderMessages(messages) {

    const container = $("messages");

    container.innerHTML = "";

    if (!messages.length) {

      container.innerHTML = `
        <div class="welcome" id="welcome">
          <div class="welcome-logo">AI</div>
          <h1>ابدئي محادثة جديدة</h1>
          <p>اكتبي أول رسالة للوكيل الذكي.</p>
        </div>
      `;

      return;
    }

    messages.forEach(message => {

      addMessageToUI(
        message.role,
        message.content
      );

    });

  }


  function addMessageToUI(role, content) {

    const container = $("messages");

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " +
      (role === "user" ? "user" : "assistant");

    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
      role === "user" ? "أنت" : "AI";

    const bubble =
      document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = content;

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);

    container.appendChild(wrapper);

  }


  /* ---------------- CHAT ---------------- */

  async function sendMessage(message) {

    if (sending) return;

    if (!message.trim()) return;

    sending = true;

    $("sendBtn").disabled = true;

    $("typing").style.display = "block";

    addMessageToUI("user", message);

    $("messageInput").value = "";

    autoResize();

    scrollToBottom();

    try {

      const data = await api("/api/chat", {
        method: "POST",
        body: JSON.stringify({
          message,
          conversationId: currentConversationId
        })
      });

      if (data.conversationId) {

        currentConversationId =
          data.conversationId;

      }

      addMessageToUI(
        "assistant",
        data.reply || "لم يصل رد."
      );

      if (data.conversationTitle) {

        $("chatTitle").textContent =
          data.conversationTitle;

      }

      /*
       * تحديث القائمة من الخادم حتى يظهر
       * العنوان الجديد وترتيب المحادثة.
       */
      try {

        const list =
          await api("/api/conversations");

        conversations =
          list.conversations || [];

        renderConversationList();

      } catch {}

      scrollToBottom();

    } catch (error) {

      addMessageToUI(
        "assistant",
        "⚠️ " + error.message
      );

    } finally {

      sending = false;

      $("sendBtn").disabled = false;

      $("typing").style.display = "none";

      $("messageInput").focus();

    }
  }


  /* ---------------- UI ---------------- */

  function scrollToBottom() {

    const chat = $("chat");

    setTimeout(() => {

      chat.scrollTop = chat.scrollHeight;

    }, 50);

  }


  function autoResize() {

    const textarea = $("messageInput");

    textarea.style.height = "auto";

    textarea.style.height =
      Math.min(textarea.scrollHeight, 140) + "px";

  }


  function closeSidebar() {

    $("sidebar").classList.remove("open");

  }


  function closeRename() {

    $("renameOverlay").style.display = "none";

    renameConversationId = null;

  }


  /* ---------------- EVENTS ---------------- */

  $("newChatBtn").addEventListener(
    "click",
    async () => {

      await createConversation();

    }
  );


  $("composer").addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const message =
        $("messageInput").value.trim();

      if (!message) return;

      await sendMessage(message);

    }
  );


  $("messageInput").addEventListener(
    "input",
    autoResize
  );


  $("messageInput").addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        $("composer").requestSubmit();

      }

    }
  );


  $("menuBtn").addEventListener(
    "click",
    () => {

      $("sidebar").classList.toggle("open");

    }
  );


  $("renameCancel").addEventListener(
    "click",
    closeRename
  );


  $("renameConfirm").addEventListener(
    "click",
    confirmRename
  );


  $("renameOverlay").addEventListener(
    "click",
    event => {

      if (
        event.target === $("renameOverlay")
      ) {

        closeRename();

      }

    }
  );


  $("renameInput").addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        confirmRename();

      }

      if (event.key === "Escape") {

        closeRename();

      }

    }
  );


  $("logoutBtn").addEventListener(
    "click",
    async () => {

      try {

        await api("/api/logout", {
          method: "POST"
        });

      } catch {}

      window.location.href = "/";

    }
  );


  /* ---------------- START ---------------- */

  async function startApp() {

    try {

      await loadUser();

      if (!currentUser) return;

      await loadConversations();

    } catch (error) {

      console.error(error);

      showToast(
        "تعذر تحميل التطبيق. تأكدي من تسجيل الدخول."
      );

    }

  }

  startApp();

</script>

</body>
</html>
