<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <title>AI Agent Pro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070b14;
      --card: #101827;
      --card2: #151f31;
      --text: #f5f7ff;
      --muted: #9aa7bd;
      --primary: #7c5cff;
      --primary2: #5b3fd4;
      --border: #263247;
      --success: #25d695;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #18213b 0%, var(--bg) 45%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), #9f7cff);
      font-size: 22px;
    }

    .status {
      color: var(--success);
      font-size: 13px;
    }

    .hero {
      text-align: center;
      padding: 35px 15px;
    }

    .hero h1 {
      font-size: clamp(30px, 8vw, 55px);
      margin-bottom: 12px;
      background: linear-gradient(90deg, #fff, #a995ff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      color: var(--muted);
      font-size: 16px;
    }

    .chat {
      background: rgba(16, 24, 39, .92);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .messages {
      min-height: 330px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .bot {
      background: var(--card2);
      border: 1px solid var(--border);
      margin-left: auto;
      margin-right: 0;
    }

    .user {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      margin-right: auto;
      margin-left: 0;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid var(--border);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: #0b1220;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:active {
      transform: scale(.97);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 18px;
    }

    .feature {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 10px;
      text-align: center;
    }

    .feature .icon {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .feature span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 12px;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .input-area {
        padding: 10px;
      }

      button {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="logo">
        <div class="logo-icon">✦</div>
        <span>AI Agent Pro</span>
      </div>

      <div class="status">● Online</div>
    </header>

    <section class="hero">
      <h1>AI Agent Pro</h1>
      <p>مساعدك الذكي لتنفيذ المهام والأفكار بسرعة.</p>
    </section>

    <section class="chat">

      <div class="messages" id="messages">
        <div class="message bot">
          👋 مرحباً! أنا AI Agent Pro.
          اكتب رسالتك بالأسفل لنبدأ.
        </div>
      </div>

      <div class="input-area">
        <input
          id="messageInput"
          type="text"
          placeholder="اكتب رسالتك هنا..."
          autocomplete="off"
        >

        <button onclick="sendMessage()">إرسال</button>
      </div>

    </section>

    <section class="features">

      <div class="feature">
        <div class="icon">🤖</div>
        <strong>AI Assistant</strong>
        <span>مساعد ذكي</span>
      </div>

      <div class="feature">
        <div class="icon">⚡</div>
        <strong>Fast</strong>
        <span>استجابة سريعة</span>
      </div>

      <div class="feature">
        <div class="icon">🔒</div>
        <strong>Secure</strong>
        <span>واجهة آمنة</span>
      </div>

    </section>

  </div>

  <script>
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      setTimeout(() => {
        addMessage(
          "وصلت رسالتك ✅\nواجهة AI Agent Pro تعمل حالياً. سنربط الذكاء الاصطناعي الحقيقي بالخطوة التالية.",
          "bot"
        );
      }, 500);
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
