<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070b14">
<title>تسجيل الدخول — AI Agent Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#070b14;
  --panel:#0e1625;
  --border:rgba(255,255,255,.09);
  --text:#f5f7fb;
  --muted:#8d99ab;
  --accent:#7c5cff;
  --accent2:#5ee7ff;
  --danger:#ff6685;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(124,92,255,.22),transparent 40%),
    var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth{
  width:min(430px,100%);
}

.logo{
  width:68px;
  height:68px;
  margin:0 auto 18px;
  border-radius:21px;
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 18px 55px rgba(124,92,255,.28);
}

.title{
  text-align:center;
  margin-bottom:25px;
}

.title h1{
  font-size:25px;
  margin-bottom:7px;
}

.title p{
  color:var(--muted);
  font-size:12px;
}

.card{
  background:rgba(14,22,37,.94);
  border:1px solid var(--border);
  border-radius:22px;
  padding:24px;
  box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.tabs{
  display:flex;
  gap:5px;
  padding:4px;
  background:#080e19;
  border-radius:12px;
  margin-bottom:22px;
}

.tab{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:11px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
}

.tab.active{
  background:#1b2639;
  color:white;
}

.form{
  display:none;
}

.form.active{
  display:block;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:11px;
  color:#aab4c4;
  margin-bottom:7px;
}

.field input{
  width:100%;
  border:1px solid var(--border);
  outline:0;
  background:#080f1b;
  color:white;
  padding:13px 12px;
  border-radius:11px;
  font-size:14px;
  direction:rtl;
}

.field input:focus{
  border-color:rgba(124,92,255,.65);
  box-shadow:0 0 0 3px rgba(124,92,255,.1);
}

.submit{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  color:white;
  font-weight:800;
  cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#6345dd);
  box-shadow:0 9px 25px rgba(124,92,255,.2);
  margin-top:4px;
}

.submit:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.error{
  display:none;
  background:rgba(255,85,119,.09);
  border:1px solid rgba(255,85,119,.2);
  color:#ff8da4;
  padding:10px 12px;
  border-radius:10px;
  font-size:11px;
  margin-bottom:14px;
  line-height:1.6;
}

.error.show{
  display:block;
}

.success{
  display:none;
  background:rgba(54,217,139,.08);
  border:1px solid rgba(54,217,139,.18);
  color:#6ee7aa;
  padding:10px 12px;
  border-radius:10px;
  font-size:11px;
  margin-bottom:14px;
}

.success.show{
  display:block;
}

.footer{
  text-align:center;
  color:#59667a;
  font-size:9px;
  margin-top:17px;
}

@media(max-width:480px){
  .card{
    padding:19px;
    border-radius:18px;
  }

  .title h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="auth">

  <div class="logo">AI</div>

  <div class="title">
    <h1>AI Agent Pro</h1>
    <p>مساحتك الذكية للعمل والإنجاز</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="showLogin()">
        تسجيل الدخول
      </button>

      <button class="tab" id="signupTab" onclick="showSignup()">
        إنشاء حساب
      </button>
    </div>

    <div class="error" id="error"></div>
    <div class="success" id="success"></div>

    <!-- LOGIN -->

    <form class="form active" id="loginForm">

      <div class="field">
        <label>البريد الإلكتروني</label>

        <input
          id="loginEmail"
          type="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label>كلمة المرور</label>

        <input
          id="loginPassword"
          type="password"
          placeholder="أدخل كلمة المرور"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="submit" id="loginButton" type="submit">
        تسجيل الدخول
      </button>

    </form>

    <!-- SIGNUP -->

    <form class="form" id="signupForm">

      <div class="field">
        <label>الاسم</label>

        <input
          id="signupName"
          type="text"
          placeholder="اسمك"
          autocomplete="name"
          required
        >
      </div>

      <div class="field">
        <label>البريد الإلكتروني</label>

        <input
          id="signupEmail"
          type="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label>كلمة المرور</label>

        <input
          id="signupPassword"
          type="password"
          placeholder="6 أحرف على الأقل"
          minlength="6"
          autocomplete="new-password"
          required
        >
      </div>

      <button class="submit" id="signupButton" type="submit">
        إنشاء الحساب
      </button>

    </form>

  </div>

  <div class="footer">
    © 2026 AI Agent Pro
  </div>

</div>

<script>

const $ = id => document.getElementById(id);

function showError(message){
  $("success").classList.remove("show");
  $("error").textContent = message;
  $("error").classList.add("show");
}

function showSuccess(message){
  $("error").classList.remove("show");
  $("success").textContent = message;
  $("success").classList.add("show");
}

function clearMessages(){
  $("error").classList.remove("show");
  $("success").classList.remove("show");
}

function showLogin(){

  clearMessages();

  $("loginTab").classList.add("active");
  $("signupTab").classList.remove("active");

  $("loginForm").classList.add("active");
  $("signupForm").classList.remove("active");
}

function showSignup(){

  clearMessages();

  $("signupTab").classList.add("active");
  $("loginTab").classList.remove("active");

  $("signupForm").classList.add("active");
  $("loginForm").classList.remove("active");
}

async function api(url, options = {}){

  const response = await fetch(url,{
    credentials:"include",
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {})
    }
  });

  let data = {};

  try{
    data = await response.json();
  }catch(_){}

  if(!response.ok){
    throw new Error(data.error || "حدث خطأ");
  }

  return data;
}

/* CHECK EXISTING SESSION */

async function checkSession(){

  try{

    const data = await api("/api/me");

    if(data.user || data){
      location.href = "/";
    }

  }catch(_){}

}

/* LOGIN */

$("loginForm").addEventListener("submit",async event=>{

  event.preventDefault();

  clearMessages();

  const email =
    $("loginEmail").value.trim();

  const password =
    $("loginPassword").value;

  const button =
    $("loginButton");

  button.disabled = true;
  button.textContent = "جاري تسجيل الدخول...";

  try{

    await api("/api/login",{
      method:"POST",
      body:JSON.stringify({
        email,
        password
      })
    });

    showSuccess("تم تسجيل الدخول بنجاح.");

    setTimeout(()=>{
      location.href = "/";
    },400);

  }catch(error){

    showError(
      error.message ||
      "البريد الإلكتروني أو كلمة المرور غير صحيحة."
    );

  }finally{

    button.disabled = false;
    button.textContent = "تسجيل الدخول";

  }

});

/* SIGNUP */

$("signupForm").addEventListener("submit",async event=>{

  event.preventDefault();

  clearMessages();

  const name =
    $("signupName").value.trim();

  const email =
    $("signupEmail").value.trim();

  const password =
    $("signupPassword").value;

  const button =
    $("signupButton");

  if(password.length < 6){
    showError("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
    return;
  }

  button.disabled = true;
  button.textContent = "جاري إنشاء الحساب...";

  try{

    await api("/api/signup",{
      method:"POST",
      body:JSON.stringify({
        name,
        email,
        password
      })
    });

    showSuccess(
      "تم إنشاء حسابك بنجاح. جاري فتح حسابك..."
    );

    setTimeout(()=>{
      location.href = "/";
    },500);

  }catch(error){

    showError(
      error.message ||
      "تعذر إنشاء الحساب."
    );

  }finally{

    button.disabled = false;
    button.textContent = "إنشاء الحساب";

  }

});

checkSession();

</script>

</body>
</html>
